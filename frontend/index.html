<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMSAI 8080 - JOSHUA INTERFACE</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="crt-monitor">
        <div class="screen-overlay"></div>
        <div class="terminal">
            <div id="output"></div>
            
            <!-- Tic Tac Toe Board -->
            <div id="tictactoe-board" class="game-board tictactoe-board" style="display: none;">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <!-- Battleship Board -->
            <div id="battleship-board" class="game-board battleship-container" style="display: none;">
                <div class="battleship-grid-container">
                    <div class="grid-label">TARGET SENSORS (AI)</div>
                    <div id="battleship-ai-grid" class="battleship-grid">
                        <!-- Generated by JS -->
                    </div>
                </div>
                <div class="battleship-grid-container">
                    <div class="grid-label">FLEET SYSTEMS (USER)</div>
                    <div id="battleship-user-grid" class="battleship-grid">
                        <!-- Generated by JS -->
                    </div>
                </div>
            </div>

            <div class="input-line">
                <span class="prompt">></span>
                <input type="text" id="command-input" autocomplete="off" autofocus>
                <span class="cursor">█</span>
            </div>
        </div>
    </div>
    <script src="js/games/tictactoe.js"></script>
    <script src="js/games/battleship.js"></script>
    <script src="js/game_manager.js"></script>
    <script src="js/terminal.js"></script>
</body>
</html>
